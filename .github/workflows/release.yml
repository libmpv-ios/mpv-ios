name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install build tools
        run: |
          brew install meson ninja pkg-config gnu-sed nasm autoconf automake libtool coreutils

      - name: Export cache key
        run: ./include/ci.sh export >>"$GITHUB_ENV"
        working-directory: buildscripts

      - uses: actions/cache@v5
        with:
          path: buildscripts/gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"

      - name: Download / build dependency prefixes
        working-directory: buildscripts
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: ${{ github.workspace }}/buildscripts/gh-cache
          IN_CI: 1
        run: |
          mkdir -p "$CACHE_FOLDER"
          ./include/ci.sh install

      - name: Build libmpv + assemble XCFramework
        working-directory: buildscripts
        run: ./include/ci.sh build

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >>"$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >>"$GITHUB_OUTPUT"
          fi

      # Fails the whole job early (before the release is created or assets
      # uploaded) if CHANGELOG.md's [Unreleased] section is empty — an
      # empty release is almost always a forgotten changelog entry, not
      # something to publish. See buildscripts/include/cut-release.sh for
      # what "notes" actually extracts.
      - name: Generate release notes from CHANGELOG.md
        id: notes
        run: |
          chmod +x buildscripts/include/cut-release.sh
          notes="$(./buildscripts/include/cut-release.sh notes '${{ steps.tag.outputs.tag }}')"
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo "RELEASE_NOTES_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Package release assets
        run: |
          mkdir -p MPVKit/Frameworks
          cp -R Libmpv.xcframework MPVKit/Frameworks/

          # Zipped XCFramework alone, for consumers who want to wire it into
          # their own Package.swift (e.g. via a binaryTarget URL+checksum).
          ditto -c -k --sequesterRsrc --keepParent Libmpv.xcframework "Libmpv.xcframework.zip"

          # Full MPVKit Swift Package, framework included, ready to drop in
          # via "Add Local Package".
          zip -r -q "MPVKit-${{ steps.tag.outputs.tag }}.zip" MPVKit -x "*.DS_Store"

      - name: Compute checksum for Swift Package binaryTarget
        run: |
          if swift package compute-checksum "Libmpv.xcframework.zip" > checksum.txt 2>/dev/null; then
            echo "Computed via swift package compute-checksum"
          else
            echo "Falling back to shasum"
            shasum -a 256 "Libmpv.xcframework.zip" | awk '{print $1}' > checksum.txt
          fi
          echo "Checksum: $(cat checksum.txt)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: mpv-ios ${{ steps.tag.outputs.tag }}
          body: |
            Prebuilt libmpv XCFramework and MPVKit Swift Package for iOS.

            **Assets:**
            - `Libmpv.xcframework.zip` — binary framework only
            - `MPVKit-${{ steps.tag.outputs.tag }}.zip` — full Swift Package (framework included)
            - `checksum.txt` — SHA-256 checksum for `binaryTarget(url:checksum:)` in a remote Package.swift

            ${{ steps.notes.outputs.body }}
          files: |
            Libmpv.xcframework.zip
            MPVKit-${{ steps.tag.outputs.tag }}.zip
            checksum.txt

      # Moves CHANGELOG.md's [Unreleased] content under this release's
      # version heading and leaves [Unreleased] empty again, then commits
      # that directly to the branch this tag points at — so the very next
      # PR that touches CHANGELOG.md starts from a clean [Unreleased], and
      # the published version heading in CHANGELOG.md always matches what
      # actually shipped in the release. Runs after the release is
      # published (not before) so a failure here never blocks the release
      # itself — worst case, this step needs a manual re-run or a
      # follow-up commit.
      - name: Update CHANGELOG.md for this release
        run: |
          ./buildscripts/include/cut-release.sh bump '${{ steps.tag.outputs.tag }}'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: move CHANGELOG.md [Unreleased] into ${{ steps.tag.outputs.tag }}"
          # actions/checkout leaves HEAD detached at the tag's commit (not
          # on a branch), so `git rev-parse --abbrev-ref HEAD` would just
          # print "HEAD" here — push explicitly to the default branch
          # instead. default_branch comes from the repo context, not
          # hardcoded, so this still works if the repo's default is
          # renamed later.
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
